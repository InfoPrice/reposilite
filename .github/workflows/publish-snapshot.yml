# GitHub Actions workflow to automatically publish snapshot builds.
name: "Publish snapshots"
on:
  push:
    branches: [ "main" ]

env:
  JAVA_VERSION: 19

jobs:
  maven:
    name: "Maven"
    runs-on: arc-runner-set-amd64
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Segredos do Vault
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.infopriceti.com.br
          method: jwt
          path: jwt-github
          role: gha-reposilite
          exportEnv: false
          secrets: |
            secret/data/ci/repos/reposilite MAVEN_NAME | MAVEN_NAME ;
            secret/data/ci/repos/reposilite MAVEN_TOKEN | MAVEN_TOKEN ;
      - name: "Checkout repository"
        uses: actions/checkout@v3

      - name: "Fetch git tags" # Required for axion-release-plugin
        run: git fetch --tags --unshallow

      - name: "Set up Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v3
        with:
          java-version: "${{ env.JAVA_VERSION }}"
          distribution: "liberica"

      - name: "Grant execute permission for gradlew"
        run: chmod +x gradlew

      - name: "Gradle publish"
        uses: gradle/gradle-build-action@v2
        with:
          arguments: "shadowJar publish"
        env:
          MAVEN_NAME: ${{ steps.vault.outputs.MAVEN_NAME }}
          MAVEN_TOKEN: ${{ steps.vault.outputs.MAVEN_TOKEN }}

  docker:
    name: "Docker"
    runs-on: arc-runner-set-amd64
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Segredos do Vault
        id: vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3
        with:
          url: https://vault.infopriceti.com.br
          method: jwt
          path: jwt-github
          role: gha-reposilite
          exportEnv: false
          secrets: |
            secret/data/ci/repos/reposilite DOCKERHUB_TOKEN | DOCKERHUB_TOKEN ;
            secret/data/ci/repos/reposilite DOCKERHUB_USERNAME | DOCKERHUB_USERNAME ;
      - name: "Checkout repository"
        uses: actions/checkout@v3

      - name: "Fetch Git tags" # Required for axion-release-plugin
        run: git fetch --tags --unshallow

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v2

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v2

      - name: "Login to DockerHub"
        uses: docker/login-action@v2
        with:
          username: "${{ steps.vault.outputs.DOCKERHUB_USERNAME }}"
          password: "${{ steps.vault.outputs.DOCKERHUB_TOKEN }}"

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Build and push"
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            dzikoysk/reposilite:nightly
            ghcr.io/dzikoysk/reposilite:nightly
